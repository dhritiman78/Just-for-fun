<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users Table - AAHES CEE Cutoffs</title>
  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBOVl1hdmprJXpgdN_sNTO3FsNePD_zNZY",
      authDomain: "aahes-cee-cutoffs.firebaseapp.com",
      databaseURL: "https://aahes-cee-cutoffs-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "aahes-cee-cutoffs",
      storageBucket: "aahes-cee-cutoffs.firebasestorage.app",
      messagingSenderId: "706066626405",
      appId: "1:706066626405:web:0d254ab82beb288108938c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Reference to 'users' table
    const usersRef = ref(db, "users");

    // Listen for changes and render data
    onValue(usersRef, (snapshot) => {
      const data = snapshot.val();
      const tableBody = document.getElementById("userTableBody");
      tableBody.innerHTML = "";

      if (!data) {
        tableBody.innerHTML = `<tr><td colspan="100%">No users found</td></tr>`;
        return;
      }

      // Extract all keys (columns)
      const firstUser = Object.values(data)[0];
      const headers = Object.keys(firstUser);

      // Render headers
      const headerRow = document.getElementById("headerRow");
      headerRow.innerHTML = "<th>ID</th>" + headers.map(h => `<th>${h}</th>`).join("");

      // Render each user
      Object.entries(data).forEach(([id, user]) => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${id}</td>` + headers.map(h => `<td>${user[h] ?? ""}</td>`).join("");
        tableBody.appendChild(row);
      });
    });
  </script>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #2563eb;
      color: white;
      text-transform: capitalize;
    }
    tr:hover {
      background: #f1f5f9;
    }
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      th {
        display: none;
      }
      tr {
        margin-bottom: 15px;
        background: white;
        border-radius: 10px;
        padding: 10px;
      }
      td {
        display: flex;
        justify-content: space-between;
        border: none;
        border-bottom: 1px solid #eee;
      }
      td::before {
        content: attr(data-label);
        font-weight: 600;
        color: #555;
      }
    }
  </style>
</head>
<body>
  <h1>👥 Users List</h1>
  <table>
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody id="userTableBody">
      <tr><td colspan="100%">Loading users...</td></tr>
    </tbody>
  </table>
</body>
</html>
